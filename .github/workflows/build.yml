# ============================================================================
#  MOBILADOR - .github/workflows/build.yml
# ============================================================================
name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows client (Mobilador.exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ziglang pillow fonttools

      - name: Generate visual assets (icons, logo, splash)
        run: python3 tools/gen_assets.py

      - name: Build Windows executable
        run: |
          mkdir -p dist/win
          python3 tools/build.py --quiet
          cp dist/Mobilador.exe dist/win/ || true
          ls -la dist/win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilador-windows
          path: dist/Mobilador.exe
          if-no-files-found: warn

  # ------------------------------------------------------------------ Android
  android:
    name: Android server module (mobilador.dex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch android.jar and d8 (Android build tools)
        run: |
          set -e
          mkdir -p /tmp/sdk/platforms /tmp/sdk/build-tools
          curl -sSL -o /tmp/platform.zip  https://dl.google.com/android/repository/platform-33_r03.zip
          curl -sSL -o /tmp/bt.zip        https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q /tmp/platform.zip -d /tmp/sdk/platforms
          unzip -q /tmp/bt.zip -d /tmp/sdk/build-tools
          mv /tmp/sdk/platforms/android-* /tmp/sdk/platforms/android-33 || true
          BT=$(ls -d /tmp/sdk/build-tools/* | head -1)
          echo "D8=$BT/d8" >> $GITHUB_ENV
          echo "ANDROID_JAR=/tmp/sdk/platforms/android-33/android.jar" >> $GITHUB_ENV
          ls -la /tmp/sdk/platforms/android-33/android.jar "$BT/d8"

      - name: Compile server module
        run: |
          set -e
          chmod +x android-server/build.sh
          ANDROID_JAR="$ANDROID_JAR" D8="$D8" ./android-server/build.sh

      - name: Verify the DEX (header + checksum)
        run: |
          python3 - <<'PY'
          import hashlib, struct, sys
          data = open('dist/mobilador.dex','rb').read()
          magic = data[:8]
          assert magic.startswith(b'dex\n0'), magic
          version = magic[4:7].decode()
          file_size = struct.unpack_from('<I', data, 32)[0]
          checksum  = struct.unpack_from('<I', data, 8)[0]
          sig       = data[12:32]
          calc_sum  = sum(data[12:]) & 0xFFFFFFFF           # adler32 over bytes 12..end
          calc_sig  = hashlib.sha1(data[32:]).digest()
          print('dex version :', version)
          print('file size   :', file_size, 'actual', len(data))
          print('adler32 ok  :', calc_sum == checksum)
          print('sha1 ok     :', calc_sig == sig)
          print('string ids  :', struct.unpack_from('<I', data, 56)[0])
          print('class defs  :', struct.unpack_from('<I', data, 96)[0])
          assert file_size == len(data)
          assert calc_sum == checksum and calc_sig == sig, 'DEX checksum mismatch'
          print('DEX is structurally valid')
          PY

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobilador-server-dex
          path: dist/mobilador.dex
          if-no-files-found: error

      # Keep the repository self contained: the built module is committed so a
      # user can download the source tree and immediately run a release.
      - name: Commit built module back to the repository
        continue-on-error: true
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p server
          cp dist/mobilador.dex server/mobilador.dex
          git add -f server/mobilador.dex
          git diff --cached --quiet || git commit -m "ci: update built server module (mobilador.dex)"
          git push || true

      # Fallback channel: the module is small, so it is also printed so it can
      # be retrieved from the run log even when artifact download is not
      # available.
      - name: Emit module for the run log
        if: always()
        run: |
          if [ -f dist/mobilador.dex ]; then
            base64 -w 200 dist/mobilador.dex | sed 's/^/MOBDEX:/' | head -20000
          fi
